<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c1030">
<style>html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}</style>
<title>Orbite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Plein écran : canvas en fond, score en haut, écrans (menu, mondes, boutique, réglages) superposés.
   Les couleurs de l'interface changent avec le monde choisi (variables posées par le script). */
:root{
  --ink:#0c1030;
  --ink-2:#1a2060;
  --ink-rgb:12,16,48;
  --coral:#ff6b57;
  --gold:#ffd36e;
  --ice:#eaf2ff;
  --font-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --font-data:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--ice);font-family:var(--font-data);
  overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit}
#stage{position:relative;height:100%;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.cur{vertical-align:-2px;flex:none}

/* HUD */
#hud{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 16px;pointer-events:none;z-index:2}
#hud button{pointer-events:auto}
.score{font-family:var(--font-display);font-weight:800;font-size:clamp(1.9rem,8vw,2.6rem);line-height:1;font-variant-numeric:tabular-nums}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:8px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;min-height:1.3em}
.dust{color:var(--gold);display:inline-flex;gap:5px;align-items:center;font-variant-numeric:tabular-nums}
.combo{color:var(--coral)}
.hud-right{display:flex;align-items:center;gap:8px}
.lives{display:flex;gap:4px;margin-right:6px}
.lives svg{width:18px;height:18px;color:#ff6b6b}
.lives .off{opacity:.2}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;padding:0;background:rgba(234,242,255,.06);border:1px solid rgba(234,242,255,.22);border-radius:50%;color:var(--ice);cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.icon-btn .off{display:none}
.icon-btn.muted .on{display:none}
.icon-btn.muted .off{display:block}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* Menu / pause / fin */
#panel{
  position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:space-between;gap:24px;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;
  background:linear-gradient(to bottom,rgba(var(--ink-rgb),.8),rgba(var(--ink-rgb),0) 34%,rgba(var(--ink-rgb),0) 50%,rgba(var(--ink-rgb),.92));
}
.p-top{display:flex;flex-direction:column;gap:14px;max-width:34rem}
.p-title{margin:0;font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.04em;line-height:1;font-size:clamp(2.6rem,15vw,5.5rem)}
.p-title.sm{font-size:clamp(1.8rem,9vw,3rem);line-height:1.08;text-wrap:balance}
.p-title .o{color:var(--coral)}
.p-lead{margin:0;font-size:.98rem;line-height:1.5;max-width:30rem;color:rgba(234,242,255,.86)}
.p-credit{margin:0;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.p-credit b{font-family:var(--font-display);font-weight:800;letter-spacing:.1em}
.p-bottom{display:flex;flex-direction:column;gap:16px;max-width:26rem;width:100%}
.stats{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px 16px}
.stat{min-width:0}
.stat dt{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(234,242,255,.6)}
.stat dd{margin:4px 0 0;font-family:var(--font-display);font-weight:500;font-size:1.35rem;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.stat.hot dd{color:var(--gold)}
.p-actions{display:flex;flex-direction:column;gap:10px}
.p-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p-row.three{grid-template-columns:repeat(3,1fr)}
.p-btn{
  appearance:none;border:0;border-radius:6px;background:var(--coral);color:var(--ink);cursor:pointer;
  font-family:var(--font-display);font-weight:800;font-size:1.05rem;letter-spacing:.1em;text-transform:uppercase;
  padding:18px 20px;width:100%;
}
.p-btn.ghost{background:transparent;color:var(--ice);border:1px solid rgba(234,242,255,.35);font-size:.68rem;padding:15px 4px;font-weight:500;letter-spacing:.06em}
.p-btn:active{transform:translateY(1px)}
.p-btn:disabled{opacity:.45;cursor:default}
.dotb{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--coral);margin-left:6px;vertical-align:middle}
.p-fine{margin:0;font-size:.74rem;line-height:1.5;color:rgba(234,242,255,.55)}

#hint{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));text-align:center;z-index:2;
  font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ice);pointer-events:none;transition:opacity .6s}
#hint.gone{opacity:0}

/* Écrans pleins : mondes, boutique et réglages */
.screen{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;background:rgba(var(--ink-rgb),.96);touch-action:pan-y}
.s-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 10px;background:transparent;border:1px solid rgba(234,242,255,.3);border-radius:6px;color:var(--ice);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.back svg{width:18px;height:18px}
.wallet{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:500;font-size:1.15rem;color:var(--gold);font-variant-numeric:tabular-nums}
.s-title{margin:4px 16px 14px;font-family:var(--font-display);font-weight:800;font-size:clamp(1.6rem,8vw,2.4rem);text-transform:uppercase;letter-spacing:.04em;line-height:1}
.s-body{flex:1;min-height:0;overflow-y:auto;padding:0 16px calc(28px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch;touch-action:pan-y}
.s-sub{margin:0 0 14px;font-size:.84rem;line-height:1.5;color:rgba(234,242,255,.7);max-width:34rem}

#shopGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
#worldList{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:8px;min-width:0;padding:10px;border:1px solid rgba(234,242,255,.14);border-radius:8px;background:rgba(234,242,255,.05)}
.card.on{border-color:var(--gold)}
.card.fresh{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.pv{position:relative;aspect-ratio:1;max-width:100%;border-radius:6px;background:radial-gradient(circle at 50% 50%,var(--ink-2),var(--ink));overflow:hidden}
.pv.wide{aspect-ratio:16/9}
.pv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{position:absolute;top:6px;left:6px;padding:3px 7px;border-radius:3px;background:var(--gold);color:var(--ink);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase}
.lockic{position:absolute;inset:0;margin:auto;width:44px;height:44px;color:var(--ice);filter:drop-shadow(0 0 6px rgba(0,0,0,.6))}
.wcard.locked canvas{filter:grayscale(.85) brightness(.5)}
.card h3{margin:2px 0 0;font-family:var(--font-display);font-weight:800;font-size:.86rem;letter-spacing:.06em;text-transform:uppercase}
.card p{margin:0;font-size:.72rem;line-height:1.45;color:rgba(234,242,255,.68);flex:1}
.card p.wtag{flex:none;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;font-size:.68rem}
.card p.wcur{flex:none;display:flex;align-items:center;gap:6px;color:var(--ice)}
.card p.wneed{flex:none}
.prog{height:8px;border-radius:4px;background:rgba(234,242,255,.14);overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold)}
.c-btn{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;min-height:44px;padding:8px;border-radius:6px;border:1px solid rgba(234,242,255,.35);background:transparent;color:var(--ice);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-variant-numeric:tabular-nums}
.c-btn small{flex-basis:100%;text-align:center;font-size:.64rem;letter-spacing:.04em;color:rgba(234,242,255,.6);text-transform:none}
.c-btn.buy{background:var(--wacc,var(--coral));border-color:var(--wacc,var(--coral));color:#080a18;font-weight:500}
.c-btn:disabled{cursor:default}
.c-btn.eq{border-color:transparent;color:var(--gold)}
.c-btn.locked{opacity:.75}

.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid rgba(234,242,255,.1);max-width:34rem}
.row.col{flex-direction:column;align-items:stretch;gap:0}
.row .t{min-width:0}
.row .t b{display:block;font-weight:500;font-size:.95rem}
.row .t span{display:block;font-size:.76rem;line-height:1.45;color:rgba(234,242,255,.62);margin-top:3px}
.sw{flex:none;width:52px;height:30px;border-radius:15px;border:1px solid rgba(234,242,255,.3);background:rgba(234,242,255,.08);position:relative;padding:0;cursor:pointer}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ice);transition:transform .18s}
.sw[aria-checked="true"]{background:var(--coral);border-color:var(--coral)}
.sw[aria-checked="true"]::after{transform:translateX(22px);background:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid rgba(234,242,255,.3);border-radius:6px;overflow:hidden;margin-top:12px}
.seg button{min-height:44px;padding:0 4px;background:transparent;color:var(--ice);border:0;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.seg button+button{border-left:1px solid rgba(234,242,255,.3)}
.seg button[aria-pressed="true"]{background:var(--ice);color:var(--ink)}
.danger-btn{min-height:44px;padding:0 16px;margin-top:12px;background:transparent;border:1px solid rgba(255,107,87,.55);border-radius:6px;color:#ff9d8f;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.danger-btn.arm{background:#ff6b57;color:#0c1030;border-color:#ff6b57}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tool-btn{min-height:44px;padding:0 14px;background:transparent;border:1px solid rgba(234,242,255,.4);border-radius:6px;color:var(--ice);font-size:.76rem;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.about{margin:22px 0 0;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.about b{font-family:var(--font-display);font-weight:800;letter-spacing:.1em}

/* Comptes */
input[type=text],input[type=password]{width:100%;box-sizing:border-box;min-height:48px;padding:0 14px;border-radius:6px;border:1px solid rgba(234,242,255,.35);background:rgba(234,242,255,.06);color:var(--ice);font:inherit;font-size:1rem;-webkit-user-select:text;user-select:text}
input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.a-wrap{flex:1;min-height:0;overflow-y:auto;padding:24px 20px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-width:26rem;width:100%;margin:0 auto;box-sizing:border-box;touch-action:pan-y}
.a-brand{margin:0;font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.04em;line-height:1;font-size:clamp(2.6rem,15vw,4.4rem)}
.a-brand .o{color:var(--coral)}
.a-lead{margin:0;font-size:.9rem;line-height:1.5;color:rgba(234,242,255,.8)}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid rgba(234,242,255,.3);border-radius:6px;overflow:hidden;flex:none}
.tabs button{min-height:44px;background:transparent;border:0;color:var(--ice);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tabs button+button{border-left:1px solid rgba(234,242,255,.3)}
.tabs button[aria-selected="true"]{background:var(--ice);color:var(--ink)}
.afield{display:flex;flex-direction:column;gap:6px}
.afield label{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(234,242,255,.7)}
.pw{position:relative}
.pw input{padding-right:96px}
.pw button{position:absolute;right:4px;top:4px;bottom:4px;padding:0 10px;background:transparent;border:0;color:var(--gold);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.meter{display:flex;align-items:center;gap:10px;font-size:.72rem;color:rgba(234,242,255,.75)}
.meter b{display:block;flex:1;height:6px;border-radius:3px;background:rgba(234,242,255,.14);overflow:hidden}
.meter i{display:block;height:100%;width:8%;background:#ff6b57;transition:width .2s,background .2s}
.meter span{min-width:5.5em;text-align:right}
.chk{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--ice);min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;margin:0;accent-color:var(--coral)}
.a-err{margin:0;min-height:1.3em;font-size:.82rem;line-height:1.4;color:#ff9d8f}
.a-fine{margin:0;font-size:.72rem;line-height:1.55;color:rgba(234,242,255,.55)}
.a-link{align-self:flex-start;min-height:44px;padding:0;background:transparent;border:0;color:var(--gold);font-size:.8rem;text-decoration:underline;cursor:pointer}
.ghost-btn{min-height:44px;padding:0 14px;background:transparent;border:1px solid rgba(234,242,255,.3);border-radius:6px;color:var(--ice);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.acc-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acc-actions .danger-btn{margin-top:0}
.acc-form{display:flex;flex-direction:column;gap:12px;margin-top:14px;max-width:26rem}
.acc-form .p-btn{font-size:.85rem;padding:14px 16px}
.acc-warn{margin:0;font-size:.76rem;line-height:1.5;color:#ff9d8f}

#toast{position:absolute;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;max-width:calc(100% - 32px);padding:10px 16px;border-radius:6px;background:var(--ice);color:var(--ink);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;text-align:center;pointer-events:none;transition:opacity .25s}
#toast.gone{opacity:0}
@media (prefers-reduced-motion:reduce){.card.fresh{animation:none}.sw::after{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud" hidden>
    <div>
      <div class="score" id="score">0</div>
      <div class="meta"><span class="dust" id="dustN"></span><span class="combo" id="combo"></span></div>
    </div>
    <div class="hud-right">
      <div class="lives" id="lives" role="img" aria-label="Vies"></div>
      <button class="icon-btn" id="btnSound" type="button" aria-label="Couper ou activer le son">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
      <button class="icon-btn" id="btnPause" type="button" aria-label="Pause">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
    </div>
  </div>

  <div id="hint" class="gone" aria-hidden="true">Touche pour changer d'orbite</div>

  <div id="panel">
    <div class="p-top">
      <h1 class="p-title" id="pTitle"></h1>
      <p class="p-lead" id="pLead"></p>
      <p class="p-credit" id="pCredit"></p>
    </div>
    <div class="p-bottom">
      <dl class="stats" id="pStats"></dl>
      <div class="p-actions" id="pActions"></div>
      <p class="p-fine" id="pFine"></p>
    </div>
  </div>

  <section class="screen" id="worlds" hidden aria-label="Mondes">
    <div class="s-head">
      <button class="back" id="worldsBack" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Retour</button>
    </div>
    <h2 class="s-title">Mondes</h2>
    <div class="s-body">
      <p class="s-sub" id="worldsSub"></p>
      <div id="worldList"></div>
    </div>
  </section>

  <section class="screen" id="shop" hidden aria-label="Boutique">
    <div class="s-head">
      <button class="back" id="shopBack" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Retour</button>
      <div class="wallet" id="shopWallet" aria-live="polite"></div>
    </div>
    <h2 class="s-title" id="shopTitle">Boutique</h2>
    <div class="s-body">
      <p class="s-sub" id="shopSub"></p>
      <div id="shopGrid"></div>
    </div>
  </section>

  <section class="screen" id="settings" hidden aria-label="Réglages">
    <div class="s-head">
      <button class="back" id="setBack" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Retour</button>
    </div>
    <h2 class="s-title">Réglages</h2>
    <div class="s-body" id="setBody"></div>
  </section>

  <section class="screen" id="auth" hidden aria-label="Connexion">
    <div class="a-wrap">
      <h1 class="a-brand"><span class="o">O</span>rbite</h1>
      <p class="a-lead" id="aLead"></p>
      <div class="tabs" role="tablist" aria-label="Connexion ou création de compte">
        <button type="button" role="tab" id="tabLogin" aria-selected="true">Se connecter</button>
        <button type="button" role="tab" id="tabCreate" aria-selected="false">Créer un compte</button>
      </div>
      <form id="authForm" novalidate style="display:flex;flex-direction:column;gap:14px">
        <div class="afield"><label for="aName">Pseudo</label>
          <input id="aName" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="16" inputmode="text" placeholder="3 à 16 caractères"></div>
        <div class="afield"><label for="aPass">Mot de passe</label>
          <div class="pw"><input id="aPass" name="password" type="password" autocomplete="current-password" maxlength="128" autocapitalize="none" spellcheck="false">
            <button type="button" id="aShow" aria-pressed="false">Afficher</button></div></div>
        <div class="afield" id="aConfirmRow" hidden><label for="aPass2">Confirmer le mot de passe</label>
          <input id="aPass2" name="password2" type="password" autocomplete="new-password" maxlength="128" autocapitalize="none" spellcheck="false"></div>
        <div class="meter" id="aMeter" hidden><b><i id="aMeterBar"></i></b><span id="aMeterTxt"></span></div>
        <label class="chk"><input type="checkbox" id="aRemember" checked> Rester connecté sur cet appareil</label>
        <p class="a-err" id="aErr" role="alert"></p>
        <button class="p-btn" id="aSubmit" type="submit">Se connecter</button>
      </form>
      <button class="a-link" id="aGuest" type="button" hidden>Continuer sans compte</button>
      <p class="a-fine" id="aFine"></p>
      <p class="p-credit">Un jeu de <b>Simalacata</b></p>
    </div>
  </section>

  <div id="toast" class="gone" role="status"></div>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const $ = id => document.getElementById(id);
const el = {
  stage:$('stage'), score:$('score'), combo:$('combo'), dustN:$('dustN'), lives:$('lives'), hud:$('hud'),
  panel:$('panel'), pTitle:$('pTitle'), pLead:$('pLead'), pCredit:$('pCredit'), pStats:$('pStats'), pActions:$('pActions'),
  pFine:$('pFine'), hint:$('hint'), btnSound:$('btnSound'), btnPause:$('btnPause'),
  worlds:$('worlds'), worldList:$('worldList'), worldsSub:$('worldsSub'), worldsBack:$('worldsBack'),
  shop:$('shop'), shopGrid:$('shopGrid'), shopWallet:$('shopWallet'), shopBack:$('shopBack'), shopTitle:$('shopTitle'), shopSub:$('shopSub'),
  settings:$('settings'), setBody:$('setBody'), setBack:$('setBack'), toast:$('toast')

// ====================== Audio ======================
let AC = null;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f1, f2, dur, type, vol) {
  if (!AC || !save.sound) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f1, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
function vibrate(ms) { try { if (save.vib && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

let toastTimer = 0;
function toast(msg) {

  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.toast.classList.add('gone'), 2200);

// ====================== Thème et géométrie ======================
let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, U = 0, R1 = 0, R2 = 0, planetR = 0, bgGrad = null, stars = [];
const laneR = l => (l ? R2 : R1);
const angDiff = (a, b) => ((a - b + Math.PI) % TAU + TAU) % TAU - Math.PI;
const shipS = () => U * 0.03;

function buildBg() {
  if (!W || !H) return;
  bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.75);
  bgGrad.addColorStop(0, TH.ink2); bgGrad.addColorStop(1, TH.ink);

  r.setProperty('--coral', TH.accent); r.setProperty('--gold', TH.curColor); r.setProperty('--ice', TH.ice);

function resize() {

  W = r.width; H = r.height;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  U = Math.min(W, H * 0.8);

// ====================== État du jeu ======================
const OMEGA = 1.4;
const REVIVE_COST = 1000;   // prix pour continuer après une défaite (une fois par partie)
const S = { mode: 'menu', paused: false, ship: null, panelKind: 'menu', panelInfo: null, primary: null, newWorld: null };

function reset() {
  S.time = 0; S.score = 0; S.dust = 0; S.chain = 0; S.chainT = 0; S.lives = 3; S.inv = 0;
  S.speed = 1; S.shake = 0; S.flash = 0; S.shipVisible = true; S.dyingT = 0;
  S.rockT = 1.6; S.dustT = 0.6; S.heartT = 22; S.unlockMsg = null;
  S.rocks = []; S.dusts = []; S.parts = []; S.texts = []; S.trail = newTrail(); S.newWorld = null; S.revived = false; S.reviveLock = 0;
  S.ship = { a: -Math.PI / 2, lane: 0, r: R1, vr: 0 };
  S.cache = { score: -1, combo: '', lives: -1, dust: -1 };
}
function mult() { return Math.min(5, 1 + Math.floor(S.chain / 4)); }
function pos(a, r) { return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; }
function shipKin() {
  const sh = S.ship, [x, y] = pos(sh.a, sh.r);
  const om = (S.mode === 'menu' || S.mode === 'over' || S.mode === 'revive') ? 0.6 : OMEGA * S.speed;
  const vx = sh.vr * Math.cos(sh.a) - sh.r * om * Math.sin(sh.a);
  const vy = sh.vr * Math.sin(sh.a) + sh.r * om * Math.cos(sh.a);
  return { x, y, hd: Math.atan2(vy, vx) };
}

function spawnRock() {
  const dir = Math.random() < 0.65 ? -1 : 1;
  const verts = [];
  for (let i = 0; i < 8; i++) verts.push(rand(0.7, 1.15));
  S.rocks.push({
    a: S.ship.a + rand(1.6, 4.7), lane: Math.random() < 0.5 ? 0 : 1, dir,
    w: rand(0.45, 1.0) * (dir < 0 ? 1 : 0.55), size: U * rand(0.03, 0.045), verts,
    rot: rand(0, TAU), spin: rand(-1.5, 1.5), age: 0, life: rand(11, 16), scale: 0, dead: false
  });
}
function rockNear(lane, a) { return S.rocks.some(r => r.lane === lane && Math.abs(angDiff(r.a, a)) < 0.4); }
function spawnDustPattern() {
  if (S.dusts.length > 12) return;
  const zig = Math.random() < 0.3;
  const n = zig ? 4 : 3 + Math.floor(Math.random() * 3);
  let lane = Math.random() < 0.5 ? 0 : 1;
  let a = S.ship.a + rand(1.5, 3.2);
  const step = zig ? 0.36 : 0.2;
  for (let i = 0; i < n; i++) {
    if (!rockNear(lane, a)) S.dusts.push({ a, lane, age: 0, ph: rand(0, TAU), kind: 'dust' });
    a += step;
    if (zig) lane ^= 1;
  }
}
function spawnHeart() {
  const lane = Math.random() < 0.5 ? 0 : 1;
  const a = S.ship.a + rand(1.8, 3.4);
  if (!rockNear(lane, a)) S.dusts.push({ a, lane, age: 0, ph: 0, kind: 'heart' });
}
function burst(x, y, color, n, speed) {
  if (reduceFx()) n = Math.ceil(n / 3);
  for (let i = 0; i < n && S.parts.length < 420; i++) {
    const ang = rand(0, TAU), v = rand(0.3, 1) * speed, life = rand(0.35, 0.8);
    S.parts.push({ x, y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, life, max: life, s: rand(1.2, 3), c: color });
  }
}
function floatText(x, y, s, c) { S.texts.push({ x, y, s, c, t: 0 }); }

function switchLane() {
  S.ship.lane ^= 1;
  tone(420, 640, 0.09, 'sine', 0.08);
  const k = shipKin();
  burst(k.x, k.y, TH.ice, 6, U * 0.15);
  el.hint.classList.add('gone');
}
function checkUnlocks() {
  for (let i = 0; i < WORLDS.length - 1; i++) {
    const w = WORLDS[i], n = WORLDS[i + 1];
    if (!save.unlocked.includes(n.id) && save.unlocked.includes(w.id) && save.life[w.id] >= goalFor(n)) {
      save.unlocked.push(n.id);
      S.newWorld = n.id; S.unlockMsg = { name: n.name, t: 0 };
      tone(440, 1320, 0.5, 'triangle', 0.12); vibrate(80);
      persist();
    }
  }
}
function collect(d, x, y) {
  if (d.kind === 'heart') {
    if (S.lives < 3) { S.lives++; floatText(x, y, '+1 vie', '#ff6b6b'); }
    else { S.score += 25 * DM().score; floatText(x, y, '+25', '#ff6b6b'); }
    tone(520, 880, 0.18, 'triangle', 0.1);
    burst(x, y, '#ff6b6b', 14, U * 0.3);
    return;
  }
  S.chain++; S.chainT = 2.4; S.dust++;
  save.wallet[TH.id]++; save.life[TH.id]++; dirty = true;
  const gain = Math.round(10 * mult() * DM().score);
  S.score += gain;
  floatText(x, y - 10, '+' + gain, TH.curColor);
  tone(660 + Math.min(S.chain, 16) * 30, 990 + Math.min(S.chain, 16) * 30, 0.12, 'triangle', 0.09);
  burst(x, y, TH.curColor, 8, U * 0.22);
  checkUnlocks();
}
function hit(rock, sx, sy) {
  rock.dead = true;
  S.lives--; S.inv = 1.7; S.chain = 0; S.chainT = 0; S.shake = 1; S.flash = 1;
  burst(sx, sy, TH.accent, 26, U * 0.45);
  const [rx, ry] = pos(rock.a, laneR(rock.lane));
  burst(rx, ry, TH.rockLine, 14, U * 0.3);
  tone(180, 50, 0.35, 'sawtooth', 0.14);
  vibrate(60);
  if (S.lives <= 0) {
    S.mode = 'dying'; S.dyingT = 1.2; S.shipVisible = false;
    burst(sx, sy, TH.ice, 30, U * 0.5);
    tone(300, 70, 0.8, 'triangle', 0.12);
  }
}

function step(dt) {
  const playing = S.mode === 'play', dm = DM();
  if (playing) S.time += dt;
  S.speed = Math.min(1.9, 1 + S.time / 80);
  const sh = S.ship;
  sh.a += OMEGA * S.speed * dt;
  const nr = sh.r + (laneR(sh.lane) - sh.r) * (1 - Math.exp(-dt * 11));
  sh.vr = dt > 0 ? Math.max(-U * 2, Math.min(U * 2, (nr - sh.r) / dt)) : 0;
  sh.r = nr;
  if (S.inv > 0) S.inv -= dt;
  if (S.chainT > 0) { S.chainT -= dt; if (S.chainT <= 0) S.chain = 0; }
  if (playing) S.score += dt * 3 * dm.score;

  if (playing) {
    S.rockT -= dt;
    const maxRocks = Math.round(Math.min(7, 3 + Math.floor(S.time / 20)) * dm.rock);
    if (S.rockT <= 0 && S.rocks.length < maxRocks) { spawnRock(); S.rockT = Math.max(0.65, 2.1 - S.time * 0.014) * rand(0.8, 1.2) / dm.rock; }
    S.dustT -= dt;
    if (S.dustT <= 0) { spawnDustPattern(); S.dustT = rand(1.6, 2.6); }
    S.heartT -= dt;
    if (S.heartT <= 0) { if (S.lives < 3) spawnHeart(); S.heartT = rand(16, 24); }
  }
  if (S.unlockMsg) { S.unlockMsg.t += dt; if (S.unlockMsg.t > 5) S.unlockMsg = null; }

  const rockSp = Math.min(1.7, 1 + S.time / 100) * dm.spd;
  for (const r of S.rocks) {
    r.age += dt;
    r.a += r.dir * r.w * rockSp * dt;
    r.rot += r.spin * dt;
    const fadeOut = r.age > r.life - 0.6 ? Math.max(0, (r.life - r.age) / 0.6) : 1;
    r.scale = Math.min(1, r.age / 0.7) * fadeOut;
  }
  S.rocks = S.rocks.filter(r => !r.dead && r.age < r.life);
  for (const d of S.dusts) d.age += dt;
  S.dusts = S.dusts.filter(d => d.age < 11);

  const [sx, sy] = pos(sh.a, sh.r);
  if (playing) {
    const collectR = U * 0.05;
    S.dusts = S.dusts.filter(d => {
      const [dx, dy] = pos(d.a, laneR(d.lane));
      if (Math.hypot(dx - sx, dy - sy) < collectR) { collect(d, dx, dy); return false; }
      return true;
    });
    if (S.inv <= 0) {
      for (const r of S.rocks) {
        if (r.scale < 0.95) continue;
        const [rx, ry] = pos(r.a, laneR(r.lane));
        if (Math.hypot(rx - sx, ry - sy) < U * 0.026 * 0.7 + r.size * 0.82) { hit(r, sx, sy); break; }
      }
    }
  }

  S.flash = Math.max(0, S.flash - dt * 3);

}
function updateFx(dt) {
  for (const p of S.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.97; p.vy *= 0.97; p.life -= dt; }
  S.parts = S.parts.filter(p => p.life > 0);
  for (const t of S.texts) { t.t += dt; t.y -= 30 * dt; }
  S.texts = S.texts.filter(t => t.t < 0.9);
  updateTrail(S.trail, dt);
}
function demo(dt) {
  const sh = S.ship;
  sh.a += 0.6 * dt;
  S.demoT -= dt;
  if (S.demoT <= 0) { sh.lane ^= 1; S.demoT = 3; }
  sh.vr = 0;
  sh.r += (laneR(sh.lane) - sh.r) * (1 - Math.exp(-dt * 4));
  updateFx(dt);
}
function emitShipTrail(t) {
  if (!S.shipVisible || !S.ship) return;
  const k = shipKin();
  trailEmit(SK(), S.trail, k.x, k.y, k.hd, shipS(), t, reduceFx());
}

// ====================== Rendu ======================
function heartPath(s) {
  ctx.beginPath();
  ctx.moveTo(0, s * 0.9);
  ctx.bezierCurveTo(-s * 1.6, -s * 0.1, -s * 0.9, -s * 1.3, 0, -s * 0.45);
  ctx.bezierCurveTo(s * 0.9, -s * 1.3, s * 1.6, -s * 0.1, 0, s * 0.9);
  ctx.closePath();
}
function draw(t) {
  if (!W) return;
  ctx.save();
  if (S.shake > 0 && !reduceFx()) { const k = S.shake * U * 0.025; ctx.translate(rand(-k, k), rand(-k, k)); }
  ctx.fillStyle = bgGrad; ctx.fillRect(-20, -20, W + 40, H + 40);
  drawDeco(ctx, W, H, t, TH, stars);

  ctx.lineWidth = 1.5; ctx.setLineDash([2, 9]); ctx.lineCap = 'round';
  for (let l = 0; l < 2; l++) {
    ctx.strokeStyle = TH.ice;
    ctx.globalAlpha = (S.ship && S.ship.lane === l && S.mode !== 'menu') ? 0.34 : 0.15;
    ctx.beginPath(); ctx.arc(cx, cy, laneR(l), 0, TAU); ctx.stroke();
  }
  ctx.setLineDash([]); ctx.globalAlpha = 1;

  drawPlanet(ctx, cx, cy, planetR, TH, t);

  for (const d of S.dusts) {
    const [x, y] = pos(d.a, laneR(d.lane));
    const fadeIn = Math.min(1, d.age / 0.3);
    const fadeOut = d.age > 9.5 ? Math.max(0, (11 - d.age) / 1.5) : 1;
    const s = U * 0.022 * (1 + 0.15 * Math.sin(t * 6 + d.ph));
    ctx.save(); ctx.globalAlpha = fadeIn * fadeOut;
    if (d.kind === 'heart') {
      ctx.translate(x, y);
      ctx.fillStyle = 'rgba(255,107,107,.2)'; ctx.beginPath(); ctx.arc(0, 0, s * 2.6, 0, TAU); ctx.fill();
      heartPath(s * 1.1); ctx.fillStyle = '#ff6b6b'; ctx.fill();
    } else drawCurrency(ctx, x, y, s, t, d.ph, TH);
    ctx.restore();
  }

  for (const r of S.rocks) {
    const [x, y] = pos(r.a, laneR(r.lane));
    if (r.age < 0.7) {
      ctx.globalAlpha = 0.5 * (1 - r.age / 0.7); ctx.strokeStyle = TH.accent; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, r.size * (2.2 - r.age * 1.2), 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
    }
    ctx.save(); ctx.translate(x, y); ctx.scale(r.scale, r.scale);
    drawRockShape(ctx, 0, 0, r.size, r.rot, r.verts, TH, t);
    ctx.restore();
  }

  drawTrail(ctx, SK(), S.trail, shipS());

  ctx.globalCompositeOperation = 'lighter';
  for (const p of S.parts) {
    const k = p.life / p.max;
    ctx.globalAlpha = k * 0.9; ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.s * (0.4 + 0.6 * k), 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

  if (S.shipVisible && S.ship) {
    const k = shipKin();
    ctx.save(); ctx.translate(k.x, k.y); ctx.rotate(k.hd);
    ctx.globalAlpha = (S.inv > 0 && Math.floor(S.inv * 10) % 2) ? 0.3 : 1;
    SK().draw(ctx, shipS(), t, k.hd);
    ctx.restore();
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `500 ${Math.round(U * 0.04)}px ${FONT_DATA}`;
  for (const f of S.texts) { ctx.globalAlpha = 1 - f.t / 0.9; ctx.fillStyle = f.c; ctx.fillText(f.s, f.x, f.y); }
  ctx.globalAlpha = 1;

  // nouveau monde débloqué
  if (S.unlockMsg) {
    const u = S.unlockMsg, al = u.t < 0.5 ? u.t / 0.5 : u.t > 4.2 ? Math.max(0, (5 - u.t) / 0.8) : 1;
    ctx.globalAlpha = al;
    ctx.fillStyle = TH.curColor; ctx.font = `500 ${Math.round(U * 0.034)}px ${FONT_DATA}`;
    ctx.fillText('NOUVEAU MONDE DÉBLOQUÉ', cx, H * 0.2);
    ctx.fillStyle = TH.ice; ctx.font = `800 ${Math.round(U * 0.09)}px ${FONT_DISPLAY}`;
    ctx.fillText(u.name.toUpperCase(), cx, H * 0.2 + U * 0.085);
    ctx.globalAlpha = 1;
  }

  if (S.flash > 0 && !reduceFx()) { ctx.fillStyle = `rgba(255,107,87,${S.flash * 0.22})`; ctx.fillRect(-20, -20, W + 40, H + 40); }
  ctx.restore();
}

// ====================== Aperçus (boutique et mondes) ======================
let previews = [];
function makeSkinPreview(canvas, sk) {
  return { kind: 'skin', cv: canvas, c: canvas.getContext('2d'), sk, T: newTrail(), a: rand(0, TAU), w: 0, h: 0 };
}
function makeWorldPreview(canvas, world) {
  const rocks = [], dusts = [];
  for (let i = 0; i < 3; i++) rocks.push({ a: rand(0, TAU), lane: i % 2, dir: i % 2 ? 1 : -1, rot: rand(0, TAU), spin: rand(-1, 1), verts: Array.from({ length: 8 }, () => rand(0.7, 1.15)) });
  for (let i = 0; i < 5; i++) dusts.push({ a: 0.6 + i * 0.22, lane: 1, ph: rand(0, TAU) });
  return { kind: 'world', cv: canvas, c: canvas.getContext('2d'), world, sk: world.skins[0], T: newTrail(), a: rand(0, TAU), w: 0, h: 0, rocks, dusts, stars: [] };
}
function sizePreviews() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  for (const pv of previews) {
    const r = pv.cv.getBoundingClientRect();
    pv.w = r.width; pv.h = r.height;
    pv.cv.width = Math.round(r.width * d); pv.cv.height = Math.round(r.height * d);
    pv.c.setTransform(d, 0, 0, d, 0, 0);
    if (pv.kind === 'world') pv.stars = makeStars(pv.w, pv.h, Math.round(pv.w * pv.h / 3200), pv.world);
  }
}
function drawSkinPreview(pv, t, dt) {
  const c = pv.c, w = pv.w, h = pv.h;
  if (!w) return;
  const m = Math.min(w, h), R = m * 0.3, s = m * 0.075;
  pv.a += 1.5 * dt;
  const x = w / 2 + Math.cos(pv.a) * R, y = h / 2 + Math.sin(pv.a) * R, hd = pv.a + Math.PI / 2;
  c.clearRect(0, 0, w, h);
  c.strokeStyle = 'rgba(234,242,255,.22)'; c.lineWidth = 1.2; c.setLineDash([2, 6]);
  c.beginPath(); c.arc(w / 2, h / 2, R, 0, TAU); c.stroke(); c.setLineDash([]);
  c.fillStyle = TH.accent; c.beginPath(); c.arc(w / 2, h / 2, m * 0.07, 0, TAU); c.fill();
  trailEmit(pv.sk, pv.T, x, y, hd, s, t, false);
  updateTrail(pv.T, dt);
  drawTrail(c, pv.sk, pv.T, s);
  c.save(); c.translate(x, y); c.rotate(hd); pv.sk.draw(c, s, t, hd); c.restore();
}
function drawWorldPreview(pv, t, dt) {
  const c = pv.c, w = pv.w, h = pv.h, th = pv.world;
  if (!w) return;
  const m = Math.min(w, h), r1 = m * 0.3, r2 = m * 0.46, cxp = w / 2, cyp = h / 2;
  c.clearRect(0, 0, w, h);
  const g = c.createRadialGradient(cxp, cyp, 0, cxp, cyp, Math.max(w, h) * 0.7);
  g.addColorStop(0, th.ink2); g.addColorStop(1, th.ink);
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  drawDeco(c, w, h, t, th, pv.stars);
  c.strokeStyle = th.ice; c.lineWidth = 1.2; c.setLineDash([2, 6]); c.globalAlpha = 0.22;
  c.beginPath(); c.arc(cxp, cyp, r1, 0, TAU); c.stroke(); c.beginPath(); c.arc(cxp, cyp, r2, 0, TAU); c.stroke();
  c.setLineDash([]); c.globalAlpha = 1;
  drawPlanet(c, cxp, cyp, m * 0.1, th, t);
  for (const d of pv.dusts) drawCurrency(c, cxp + Math.cos(d.a) * r2, cyp + Math.sin(d.a) * r2, m * 0.028, t, d.ph, th);
  for (const rk of pv.rocks) {
    rk.a += rk.dir * 0.3 * dt; rk.rot += rk.spin * dt;
    const rr = rk.lane ? r2 : r1;
    drawRockShape(c, cxp + Math.cos(rk.a) * rr, cyp + Math.sin(rk.a) * rr, m * 0.042, rk.rot, rk.verts, th, t);
  }
  pv.a += 1.1 * dt;
  const s = m * 0.05, x = cxp + Math.cos(pv.a) * r1, y = cyp + Math.sin(pv.a) * r1, hd = pv.a + Math.PI / 2;
  trailEmit(pv.sk, pv.T, x, y, hd, s, t, false); updateTrail(pv.T, dt); drawTrail(c, pv.sk, pv.T, s);
  c.save(); c.translate(x, y); c.rotate(hd); pv.sk.draw(c, s, t, hd); c.restore();
}

function renderShop(freshId) {

function buy(sk) {

const TEST_TOOLS = false;
function applySoundBtn() { el.btnSound.classList.toggle('muted', !save.sound); }
el.setBody.addEventListener('click', e => {
  
  const swb = e.target.closest('.sw');

    const k = swb.dataset.key; save[k] = !save[k]; persist();

// ====================== Flux de partie ======================
function startGame() {
  initAudio();
  const first = save.games === 0;
  save.games++; persist();
  reset();
  S.mode = 'play'; S.paused = false;
  hideScreens(); el.hud.hidden = false;
  if (first) { el.hint.classList.remove('gone'); setTimeout(() => el.hint.classList.add('gone'), 5000); }
  renderHud();
}
function lockRevive() {
  const b = el.pActions.querySelector('button');
  if (!b) return;
  b.disabled = true; S.reviveLock = performance.now() + 900;   // évite de payer par un tapotement raté
  setTimeout(() => { if (S.mode === 'revive' && b.isConnected) b.disabled = false; }, 900);
}
function reviveGame() {
  if (S.mode !== 'revive' || performance.now() < S.reviveLock || wallet() < REVIVE_COST) return;
  save.wallet[TH.id] -= REVIVE_COST; S.revived = true; persist();
  S.lives = 2; S.inv = 3; S.chain = 0; S.chainT = 0; S.dyingT = 0; S.shipVisible = true;
  S.rocks = []; S.rockT = 1.8; S.paused = false; S.mode = 'play';
  hideScreens(); el.hud.hidden = false; S.cache.lives = -1; last = performance.now();
  const k = shipKin();
  burst(k.x, k.y, TH.curColor, 30, U * 0.5); burst(k.x, k.y, TH.ice, 16, U * 0.3);
  tone(300, 900, 0.4, 'triangle', 0.12); vibrate(40);
  toast('Revécu · -' + fmt(REVIVE_COST) + ' ' + TH.curName);
  renderHud();
}
function endGame(final) {
  if (!final && !S.revived && wallet() >= REVIVE_COST) {
    S.mode = 'revive'; el.hud.hidden = true; el.hint.classList.add('gone');
    showPanel('revive'); lockRevive();
    return;
  }
  const sc = Math.floor(S.score), prev = best(), record = sc > prev;
  if (record) save.best[TH.id] = sc;
  persist();
  S.mode = 'over';
  let lead;
  if (prev === 0) lead = 'Premier vol terminé. Le record est à toi.';
  else if (record) lead = 'Nouveau record. Beau vol.';
  else lead = `Encore ${fmt(prev - sc + 1)} points pour dépasser ton record.`;
  if (S.newWorld) lead = `Le monde ${worldById(S.newWorld).name} est débloqué. Va le voir dans Mondes.`;
  else {
    const buyable = TH.skins.filter(s => !save.owned[TH.id].includes(s.id) && s.price <= wallet()).sort((a, b) => a.price - b.price)[0];
    if (buyable) lead += ` Tu peux t'offrir le vaisseau ${buyable.name} à la boutique.`;
  }
  el.hud.hidden = true; el.hint.classList.add('gone');
  showPanel('over', { lead, score: sc, best: best(), dust: S.dust, record });
}
function pauseGame() {
  if (S.mode === 'play' && !S.paused) { S.paused = true; persist(); showPanel('pause'); }
}
function resumeGame() { S.paused = false; hideScreens(); last = performance.now(); }
function quitToMenu() {
  const sc = Math.floor(S.score);
  if (S.mode !== 'menu' && sc > best()) save.best[TH.id] = sc;
  persist();
  reset(); S.demoT = 2.5; S.mode = 'menu'; S.paused = false;
  el.hud.hidden = true; el.hint.classList.add('gone');
  showPanel('menu');
}
function renderHud() {
  const sc = Math.floor(S.score);
  if (sc !== S.cache.score) { S.cache.score = sc; el.score.textContent = fmt(sc); }
  const cb = S.chain > 0 ? `Chaîne ${S.chain} · ×${mult()}` : '';
  if (cb !== S.cache.combo) { S.cache.combo = cb; el.combo.textContent = cb; }
  if (S.dust !== S.cache.dust) { S.cache.dust = S.dust; el.dustN.innerHTML = curIcon(TH, 14) + S.dust; }
  if (S.lives !== S.cache.lives) {
    S.cache.lives = S.lives;
    el.lives.setAttribute('aria-label', `Vies : ${S.lives} sur 3`);
    el.lives.innerHTML = [0, 1, 2].map(i => `<svg class="${i < S.lives ? '' : 'off'}" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="${HEART_PATH}"/></svg>`).join('');
  }
}

// ====================== Entrées ======================
el.stage.addEventListener('pointerdown', e => {
  initAudio();
  if (S.mode !== 'play' || S.paused || e.target.closest('button')) return;
  e.preventDefault();
  switchLane();
});
el.stage.addEventListener('contextmenu', e => e.preventDefault());
el.btnPause.addEventListener('click', pauseGame);
el.btnSound.addEventListener('click', () => { save.sound = !save.sound; persist(); applySoundBtn(); initAudio(); });
el.shopBack.addEventListener('click', backToPanel);
el.setBack.addEventListener('click', backToPanel);
el.worldsBack.addEventListener('click', backToPanel);
window.addEventListener('keydown', e => {
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (!$('auth').hidden) return;
  const inSub = !el.shop.hidden || !el.settings.hidden || !el.worlds.hidden;
  if (e.key === 'Escape' && inSub) { backToPanel(); return; }
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    if (S.mode === 'play' && !S.paused) { e.preventDefault(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); switchLane(); return; }
    if (inSub) return;
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
    if (!el.panel.hidden && S.primary) { e.preventDefault(); S.primary(); }
  } else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
    if (S.mode === 'play') { S.paused ? resumeGame() : pauseGame(); }
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { pauseGame(); persist(); } });
window.addEventListener('pagehide', persist);
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));

// ====================== Comptes (enregistrés sur cet appareil) ======================
const ACC_KEY = 'orbite-accounts-v1', THROTTLE_KEY = 'orbite-auth-throttle', REMEMBER_KEY = 'orbite-remember', SESSION_KEY = 'orbite-session';
const PBKDF_ITER = 310000;
const hasCrypto = !!(window.crypto && window.crypto.subtle && window.crypto.getRandomValues);
const te = new TextEncoder();
const DUMMY_SALT = new Uint8Array(16);
const toB64 = buf => { const a = new Uint8Array(buf); let t = ''; for (let i = 0; i < a.length; i++) t += String.fromCharCode(a[i]); return btoa(t); };
const fromB64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function derive(pw, salt, iter) {
  const key = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, key, 256));
}
function sameBytes(a, b) { if (a.length !== b.length) return false; let d = 0; for (let i = 0; i < a.length; i++) d |= a[i] ^ b[i]; return d === 0; }
function accountsRead() {
  try { const o = JSON.parse(localStorage.getItem(ACC_KEY) || '{}'); if (o && typeof o === 'object' && o.users && typeof o.users === 'object') return o; } catch (e) {}
  return { users: {} };
}
function accountsWrite(a) { try { localStorage.setItem(ACC_KEY, JSON.stringify(a)); return true; } catch (e) { return false; } }
const ukeyOf = n => 'u:' + String(n).trim().normalize('NFC').toLowerCase();
const NAME_RE = /^[A-Za-z0-9_.-]{3,16}$/;
const COMMON_PW = ['12345678', '123456789', '1234567890', '87654321', 'password', 'password1', 'motdepasse', 'azertyui', 'azertyuiop', 'azerty123', 'qwertyui', 'qwertyuiop', '00000000', '11111111', 'iloveyou', 'orbite123', 'orbitegame', 'abcd1234', 'a1b2c3d4'];
let acct = null;   // { key, name } du compte connecté

function pwKinds(pw) { return [/[a-z]/, /[A-Z]/, /\d/, /[^A-Za-z0-9]/].filter(r => r.test(pw)).length; }
function pwProblem(pw, name) {
  if (pw.length < 8) return 'Le mot de passe doit faire au moins 8 caractères.';
  if (pw.length > 128) return 'Le mot de passe ne doit pas dépasser 128 caractères.';
  if (pwKinds(pw) < 2) return 'Mélange au moins deux types de caractères : minuscules, majuscules, chiffres ou symboles.';
  const low = pw.toLowerCase();
  if (COMMON_PW.includes(low)) return 'Ce mot de passe est trop courant.';
  if (name && low.includes(String(name).toLowerCase())) return 'Le mot de passe ne doit pas contenir ton pseudo.';
  return '';
}
function pwScore(pw) {
  let n = 0;
  if (pw.length >= 8) n++; if (pw.length >= 12) n++; if (pw.length >= 16) n++;
  const k = pwKinds(pw); if (k >= 3) n++; if (k >= 4) n++;
  return Math.min(4, n);
}

// protection contre les essais en rafale (survit au rechargement de la page)
function thrRead() { try { const o = JSON.parse(localStorage.getItem(THROTTLE_KEY) || '{}'); return { n: +o.n || 0, until: +o.until || 0 }; } catch (e) { return { n: 0, until: 0 }; } }
function thrWrite(o) { try { localStorage.setItem(THROTTLE_KEY, JSON.stringify(o)); } catch (e) {} }
const thrWait = () => Math.max(0, thrRead().until - Date.now());
function thrFail() { const o = thrRead(); o.n++; if (o.n >= 5) o.until = Date.now() + Math.min(900000, 30000 * Math.pow(2, o.n - 5)); thrWrite(o); }
function thrClear() { try { localStorage.removeItem(THROTTLE_KEY); } catch (e) {} }

function sessionGet() { try { return sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(REMEMBER_KEY) || null; } catch (e) { return null; } }
function sessionSet(key, remember) {
  try { sessionStorage.removeItem(SESSION_KEY); localStorage.removeItem(REMEMBER_KEY); if (remember) localStorage.setItem(REMEMBER_KEY, key); else sessionStorage.setItem(SESSION_KEY, key); } catch (e) {}
}
function sessionClear() { try { sessionStorage.removeItem(SESSION_KEY); localStorage.removeItem(REMEMBER_KEY); } catch (e) {} }

function finishLogin() {
  TH = worldById(save.world); applyTheme(); applySoundBtn();
  reset(); S.demoT = 2.5; S.mode = 'menu'; S.paused = false;
  el.hud.hidden = true; el.hint.classList.add('gone');
  showPanel('menu');
}
function enterGame(key) {
  const rec = accountsRead().users[key];
  if (!rec) return false;
  acct = { key, name: String(rec.name) }; SAVE_KEY = SAVE_PREFIX + key;
  loadSave(); finishLogin();
  return true;
}
function logout() { persist(); sessionClear(); showAuth(); }

// ---------- écran de connexion ----------
const A = {
  form:$('authForm'), name:$('aName'), pass:$('aPass'), pass2:$('aPass2'), confirmRow:$('aConfirmRow'), meter:$('aMeter'),
  bar:$('aMeterBar'), txt:$('aMeterTxt'), err:$('aErr'), submit:$('aSubmit'), remember:$('aRemember'), show:$('aShow'),
  tabL:$('tabLogin'), tabC:$('tabCreate'), lead:$('aLead'), fine:$('aFine'), guest:$('aGuest')
};
let aMode = 'login', busy = false, lockTimer = 0;
const authError = m => { A.err.textContent = m; };
function updateMeter() {
  const pw = A.pass.value, sc = pw ? pwScore(pw) : 0;
  const labels = ['Très faible', 'Faible', 'Correct', 'Solide', 'Très solide'], cols = ['#ff6b57', '#ff9a4d', '#ffd36e', '#9be86f', '#45ffb1'];
  A.bar.style.width = (pw ? (sc + 1) * 20 : 4) + '%'; A.bar.style.background = cols[sc];
  A.txt.textContent = pw ? labels[sc] : '';
}
function refreshLock() {
  clearInterval(lockTimer);
  const tick = () => {
    const w = thrWait();
    if (w > 0) { A.submit.disabled = true; authError(`Trop d'essais. Réessaie dans ${Math.ceil(w / 1000)} s.`); }
    else { clearInterval(lockTimer); if (!busy) A.submit.disabled = false; if (/^Trop d'essais/.test(A.err.textContent)) authError(''); }
  };
  if (thrWait() > 0) { tick(); lockTimer = setInterval(tick, 1000); }
}
function setAuthMode(m) {
  aMode = m;
  A.tabL.setAttribute('aria-selected', String(m === 'login')); A.tabC.setAttribute('aria-selected', String(m === 'create'));
  A.confirmRow.hidden = m !== 'create'; A.meter.hidden = m !== 'create';
  A.pass.autocomplete = m === 'create' ? 'new-password' : 'current-password';
  A.submit.textContent = m === 'create' ? 'Créer mon compte' : 'Se connecter';
  A.lead.textContent = m === 'create'
    ? 'Crée ton compte Orbite pour garder tes mondes, tes monnaies et tes vaisseaux.'
    : 'Content de te revoir. Entre ton pseudo et ton mot de passe.';
  A.fine.textContent = "Ton compte est enregistré sur cet appareil. Ton mot de passe est transformé en empreinte avec PBKDF2 et n'est jamais gardé en clair. Il n'existe aucun moyen de le récupérer : si tu l'oublies, la progression de ce compte est perdue. Le compte n'existe pas sur tes autres appareils.";
  authError(''); updateMeter(); refreshLock();
}
function showAuth() {
  acct = null; SAVE_KEY = null; save = defaultSave(); TH = worldById('corail'); applyTheme(); applySoundBtn();
  reset(); S.demoT = 2.5; S.mode = 'menu'; S.paused = false;
  hideScreens(); el.hud.hidden = true; el.hint.classList.add('gone');
  A.name.value = ''; A.pass.value = ''; A.pass2.value = '';
  $('auth').hidden = false;
  A.guest.hidden = hasCrypto;
  setAuthMode(Object.keys(accountsRead().users).length ? 'login' : 'create');
  if (!hasCrypto) authError('Les comptes sécurisés ne sont pas disponibles dans ce navigateur.');
  A.name.focus({ preventScroll: true });
}
async function doLogin(name, pw, remember) {
  const key = ukeyOf(name), rec = accountsRead().users[key];
  let ok = false;
  if (rec && typeof rec.salt === 'string' && typeof rec.hash === 'string') {
    try { ok = sameBytes(await derive(pw, fromB64(rec.salt), rec.iter || PBKDF_ITER), fromB64(rec.hash)); } catch (e) { ok = false; }
  } else await derive(pw, DUMMY_SALT, PBKDF_ITER);
  if (!ok) { thrFail(); authError('Pseudo ou mot de passe incorrect.'); refreshLock(); return; }
  thrClear(); sessionSet(key, remember);
  A.pass.value = ''; A.pass2.value = ''; A.name.value = '';
  enterGame(key);
}
async function doCreate(name, pw, pw2, remember) {
  if (pw !== pw2) return authError('Les deux mots de passe ne sont pas identiques.');
  const prob = pwProblem(pw, name);
  if (prob) return authError(prob);
  const a = accountsRead(), key = ukeyOf(name);
  if (a.users[key]) return authError('Ce pseudo est déjà pris sur cet appareil.');
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const hash = await derive(pw, salt, PBKDF_ITER);
  a.users[key] = { name, salt: toB64(salt), iter: PBKDF_ITER, hash: toB64(hash), created: Date.now() };
  if (!accountsWrite(a)) return authError("Impossible d'enregistrer sur cet appareil (navigation privée ou stockage plein ?).");
  sessionSet(key, remember);
  acct = { key, name }; SAVE_KEY = SAVE_PREFIX + key;
  save = defaultSave();
  let claimed = false;
  try {
    if (!localStorage.getItem(LEGACY_CLAIM)) {
      const lg = readLegacy();
      if (lg) { applySaveObject(lg); claimed = true; }
      localStorage.setItem(LEGACY_CLAIM, '1');
    }
  } catch (e) {}
  normalizeSave(); persist();
  A.pass.value = ''; A.pass2.value = ''; A.name.value = '';
  finishLogin();
  if (claimed) toast('Ta progression existante a été reprise dans ce compte');
}
A.tabL.addEventListener('click', () => setAuthMode('login'));
A.tabC.addEventListener('click', () => setAuthMode('create'));
A.pass.addEventListener('input', updateMeter);
A.show.addEventListener('click', () => {
  const on = A.pass.type === 'password';
  A.pass.type = on ? 'text' : 'password'; A.pass2.type = A.pass.type;
  A.show.textContent = on ? 'Masquer' : 'Afficher'; A.show.setAttribute('aria-pressed', String(on));
});
A.guest.addEventListener('click', () => {
  acct = { key: 'guest', name: 'Invité' }; SAVE_KEY = SAVE_PREFIX + 'guest'; loadSave(); finishLogin();
});
A.form.addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;
  const name = A.name.value.trim(), pw = A.pass.value;
  authError('');
  if (!hasCrypto) { authError('Les comptes sécurisés ne sont pas disponibles dans ce navigateur.'); return; }
  if (thrWait() > 0) { refreshLock(); return; }
  if (!NAME_RE.test(name)) { authError('Pseudo : 3 à 16 caractères, avec des lettres, des chiffres, _ . ou -.'); A.name.focus(); return; }
  if (!pw) { authError('Entre ton mot de passe.'); A.pass.focus(); return; }
  busy = true; A.submit.disabled = true; A.submit.textContent = 'Vérification…';
  try {
    if (aMode === 'create') await doCreate(name, pw, A.pass2.value, A.remember.checked);
    else await doLogin(name, pw, A.remember.checked);
  } catch (ex) { authError('Une erreur est survenue. Réessaie.'); }
  busy = false; A.submit.disabled = thrWait() > 0;
  A.submit.textContent = aMode === 'create' ? 'Créer mon compte' : 'Se connecter';
});

// ---------- gestion du compte (réglages) ----------
function accountBlock() {
  if (!acct) return '';
  const pwf = (id, label, auto) => `<div class="afield"><label for="${id}">${label}</label><input id="${id}" type="password" autocomplete="${auto}" maxlength="128" autocapitalize="none" spellcheck="false"></div>`;
  return `<div class="row col"><div class="t"><b>Compte Orbite</b><span>Connecté en tant que <strong>${esc(acct.name)}</strong>. Ta progression est enregistrée sur cet appareil.</span></div>
    <div class="acc-actions">
      <button class="ghost-btn" type="button" data-act="logout">Se déconnecter</button>
      <button class="ghost-btn" type="button" data-act="pw">Changer le mot de passe</button>
      <button class="danger-btn" type="button" data-act="del">Supprimer le compte</button>
    </div>
    <form class="acc-form" id="pwForm" hidden>${pwf('pwCur', 'Mot de passe actuel', 'current-password')}${pwf('pwNew', 'Nouveau mot de passe', 'new-password')}${pwf('pwNew2', 'Confirmer le nouveau mot de passe', 'new-password')}
      <p class="a-err" id="pwErr" role="alert"></p><button class="p-btn" type="submit">Enregistrer</button></form>
    <form class="acc-form" id="delForm" hidden><p class="acc-warn">Cette action efface ce compte et toute sa progression sur cet appareil. Elle est définitive.</p>${pwf('delPw', 'Mot de passe', 'current-password')}
      <p class="a-err" id="delErr" role="alert"></p><button class="danger-btn arm" type="submit">Supprimer définitivement</button></form>
  </div>`;
}
async function verifyCurrent(pw, errEl) {
  if (thrWait() > 0) { errEl.textContent = `Trop d'essais. Réessaie dans ${Math.ceil(thrWait() / 1000)} s.`; return null; }
  const rec = accountsRead().users[acct.key];
  let ok = false;
  try { ok = !!rec && sameBytes(await derive(pw, fromB64(rec.salt), rec.iter || PBKDF_ITER), fromB64(rec.hash)); } catch (e) {}
  if (!ok) { thrFail(); errEl.textContent = 'Mot de passe incorrect.'; return null; }
  thrClear();
  return rec;
}
el.setBody.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'logout') { logout(); return; }
  const pwF = $('pwForm'), delF = $('delForm');
  if (act === 'pw') { pwF.hidden = !pwF.hidden; delF.hidden = true; if (!pwF.hidden) $('pwCur').focus(); }
  if (act === 'del') { delF.hidden = !delF.hidden; pwF.hidden = true; if (!delF.hidden) $('delPw').focus(); }
});
el.setBody.addEventListener('submit', async e => {
  e.preventDefault();
  if (!acct || !hasCrypto) return;
  if (e.target.id === 'pwForm') {
    const err = $('pwErr'); err.textContent = '';
    const cur = $('pwCur').value, nw = $('pwNew').value, nw2 = $('pwNew2').value;
    const rec = await verifyCurrent(cur, err);
    if (!rec) return;
    if (nw !== nw2) { err.textContent = 'Les deux nouveaux mots de passe ne sont pas identiques.'; return; }
    const prob = pwProblem(nw, acct.name);
    if (prob) { err.textContent = prob; return; }
    const salt = crypto.getRandomValues(new Uint8Array(16)), hash = await derive(nw, salt, PBKDF_ITER);
    const a = accountsRead(); a.users[acct.key] = Object.assign({}, rec, { salt: toB64(salt), iter: PBKDF_ITER, hash: toB64(hash) });
    if (!accountsWrite(a)) { err.textContent = "Impossible d'enregistrer le nouveau mot de passe."; return; }
    toast('Mot de passe modifié'); renderSettings();
  } else if (e.target.id === 'delForm') {
    const err = $('delErr'); err.textContent = '';
    const rec = await verifyCurrent($('delPw').value, err);
    if (!rec) return;
    const a = accountsRead(); delete a.users[acct.key]; accountsWrite(a);
    try { localStorage.removeItem(SAVE_KEY); } catch (ex) {}
    sessionClear(); showAuth(); toast('Compte supprimé');
  }
});

function boot() {
  const k = sessionGet();
  if (k && enterGame(k)) return;
  showAuth();
}

// ====================== Boucle ======================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  const t = now / 1000;
  if (!el.shop.hidden || !el.worlds.hidden) {
    for (const pv of previews) (pv.kind === 'world' ? drawWorldPreview : drawSkinPreview)(pv, t, dt);
    requestAnimationFrame(frame);
    return;
  }
  if (S.mode === 'play') {
    if (!S.paused) { step(dt); emitShipTrail(t); renderHud(); }
  } else if (S.mode === 'dying') {
    S.dyingT -= dt;
    step(dt * 0.35); renderHud();
    if (S.dyingT <= 0) endGame();
  } else if (S.mode === 'over' || S.mode === 'revive') updateFx(dt);
  else { demo(dt); emitShipTrail(t); }
  draw(t);
  if (dirty && now - lastSave > 2000) persist();
  requestAnimationFrame(frame);
}

reset();
S.demoT = 2.5;
resize();
applyTheme();
boot();
requestAnimationFrame(frame);
})();
</script>
